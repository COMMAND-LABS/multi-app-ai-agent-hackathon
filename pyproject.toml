[project]
name = "multi-app-ai-agent"
version = "0.1.0"
description = "Agent-driven integrations for YouTube, Airtable, and Metricool"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-cloud-storage>=3.14.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
